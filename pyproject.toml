[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fde-for-beginners"
version = "0.1.0.dev1"
description = "A hands-on field guide for Forward Deployed Engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ravi Kiran Pagidi"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fde_beginners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
