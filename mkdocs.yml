site_name: FDE for Beginners
site_description: Learn Forward Deployed Engineering through customer problems and engineering evidence.
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
hooks:
  - scripts/docs_hook.py
watch:
  - README.md
  - START_HERE.md
  - ROADMAP.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - labs
  - templates
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: README.md
  - Start here: START_HERE.md
  - Learning paths:
      - Choose your path: docs/learning-paths/choose-your-path.md
      - Skills matrix: docs/learning-paths/skills-matrix.md
      - Progress tracker: docs/learning-paths/progress-tracker.md
  - Foundations:
      - What is FDE?: docs/foundations/what-is-fde.md
      - FDE lifecycle: docs/foundations/fde-lifecycle.md
  - Field practice:
      - Customer discovery: docs/field/customer-discovery.md
      - Problem framing: docs/field/problem-framing.md
      - Solution design: docs/field/solution-design.md
      - Production reality: docs/field/production-reality.md
  - Labs:
      - Reliable API Integration: labs/01-reliable-api-integration/README.md
      - RAG and Evaluation: labs/02-rag-and-evaluation/README.md
      - MCP and Safe Tools: labs/03-mcp-safe-tools/README.md
  - Field templates:
      - Discovery questionnaire: templates/discovery-questionnaire.md
      - Problem and success metrics: templates/problem-statement-and-success-metrics.md
      - Technical design: templates/technical-design.md
      - Architecture decision: templates/architecture-decision-record.md
      - Evaluation plan: templates/evaluation-plan.md
      - Production readiness: templates/production-readiness-checklist.md
      - Rollout and handoff: templates/rollout-and-handoff.md
      - Postmortem: templates/postmortem.md
  - Roadmap: ROADMAP.md
  - References: docs/references.md
  - Contributing: CONTRIBUTING.md
  - Code of conduct: CODE_OF_CONDUCT.md
  - Security: SECURITY.md
