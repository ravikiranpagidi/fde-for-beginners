name: Learning or runtime bug
description: Report a reproducible problem using synthetic data only.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and environment
      description: Include the page or command, OS, Python version, and minimal synthetic input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized output. Report sensitive security issues privately.
    validations:
      required: true
