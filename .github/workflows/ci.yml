name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      FDE_LLM_PROVIDER: mock
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --offline ruff check .
      - run: uv run --offline ruff format --check .
      - run: uv run --offline pytest
      - run: uv run --offline mkdocs build --strict
